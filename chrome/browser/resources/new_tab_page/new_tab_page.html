<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}" $i18n{roundedIconsAttribute} $i18n{webuiRoundedIconsAttribute} dark>
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <title>$i18n{title}</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #0c0e14;
        background-image:
          radial-gradient(ellipse 75% 55% at 20% 10%, rgba(64, 120, 242, 0.16) 0%, transparent 65%),
          radial-gradient(ellipse 65% 50% at 82% 14%, rgba(255, 89, 81, 0.12) 0%, transparent 62%),
          radial-gradient(ellipse 85% 65% at 50% 95%, rgba(42, 54, 88, 0.24) 0%, transparent 72%),
          linear-gradient(180deg, #131620 0%, #0b0d13 100%);
        background-attachment: fixed;
        color: rgba(255, 255, 255, 0.92);
        font: 100%/1.45 -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Display', 'Segoe UI Variable Text', system-ui, sans-serif;
        font-optical-sizing: auto;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      @media (prefers-reduced-transparency: reduce) {
        html,
        body {
          background-image: none;
          background-color: #101218;
        }
      }

      #backgroundImage {
        border: none;
        height: 100%;
        pointer-events: none;
        position: fixed;
        top: 0;
        visibility: hidden;
        width: 100%;
      }

      [show-background-image] #backgroundImage {
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <iframe id="backgroundImage" src="$i18nRaw{backgroundImageUrl}"></iframe>
    <ntp-app></ntp-app>
    <script type="module" src="new_tab_page.js"></script>
    <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
    <link rel="stylesheet" href="chrome://theme/colors.css?sets=ui,chrome">
    <link rel="stylesheet" href="shared_vars.css">
  </body>
</html>
