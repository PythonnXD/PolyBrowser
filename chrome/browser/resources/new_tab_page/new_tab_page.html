<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}" $i18n{roundedIconsAttribute} $i18n{webuiRoundedIconsAttribute} dark>
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <title>$i18n{title}</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #11131a;
        background-image:
          radial-gradient(ellipse 80% 60% at 18% 12%, rgba(56, 108, 212, 0.14) 0%, transparent 65%),
          radial-gradient(ellipse 70% 55% at 82% 18%, rgba(255, 89, 89, 0.11) 0%, transparent 60%),
          radial-gradient(ellipse 90% 70% at 50% 90%, rgba(45, 55, 82, 0.22) 0%, transparent 70%),
          linear-gradient(180deg, #151821 0%, #0e1017 100%);
        background-attachment: fixed;
        color: #f1f5f9;
        font-family: 'Segoe UI Variable Display', 'Segoe UI Variable Text', 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #backgroundImage {
        border: none;
        height: 100%;
        pointer-events: none;
        position: fixed;
        top: 0;
        visibility: hidden;
        width: 100%;
      }

      [show-background-image] #backgroundImage {
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <iframe id="backgroundImage" src="$i18nRaw{backgroundImageUrl}"></iframe>
    <ntp-app></ntp-app>
    <script type="module" src="new_tab_page.js"></script>
    <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
    <link rel="stylesheet" href="chrome://theme/colors.css?sets=ui,chrome">
    <link rel="stylesheet" href="shared_vars.css">
  </body>
</html>
