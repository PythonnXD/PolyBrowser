<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}"
    $i18n{hascustombackground} $i18n{isdark} $i18n{webuiRoundedIconsAttribute} dark>
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <title>$i18n{title}</title>
    <style>
      html {
        --ntp-focus-shadow-color: rgba(96, 165, 250, 0.5);
        --ntp-theme-text-color: #f1f5f9;
        height: 100%;
        overflow: auto;
      }

      body {
        align-items: center;
        display: flex;
        min-height: 100vh;
        justify-content: center;
        margin: 0;
        background-color: #11131a;
        background-image:
          radial-gradient(ellipse 80% 60% at 18% 12%, rgba(56, 108, 212, 0.14) 0%, transparent 65%),
          radial-gradient(ellipse 70% 55% at 82% 18%, rgba(255, 89, 89, 0.11) 0%, transparent 60%),
          radial-gradient(ellipse 90% 70% at 50% 90%, rgba(45, 55, 82, 0.22) 0%, transparent 70%),
          linear-gradient(180deg, #151821 0%, #0e1017 100%);
        background-attachment: fixed;
        color: #f1f5f9;
        font-family: 'Segoe UI Variable Display', 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Windows Mica frosted dark backdrop overlay */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.04), transparent 75%),
                    linear-gradient(180deg, rgba(16, 18, 24, 0.55) 0%, rgba(10, 12, 18, 0.85) 100%);
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        pointer-events: none;
        z-index: -1;
      }

      /* Frosted glass Mica tile container */
      cr-most-visited {
        --most-visited-focus-shadow: 0 0 0 2px rgba(96, 165, 250, 0.6);
        --most-visited-text-color: #f1f5f9;
        --most-visited-text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        background: rgba(30, 34, 45, 0.65);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        padding: 24px 32px;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      cr-most-visited:hover {
        transform: translateY(-2px);
        background: rgba(36, 41, 54, 0.75);
        border-color: rgba(255, 255, 255, 0.18);
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.14);
      }

      html[has-custom-background] cr-most-visited {
        --most-visited-text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <script type="module" src="strings.m.js"></script>
    <cr-most-visited></cr-most-visited>
    <script type="module" src="new_tab_page_third_party.js"></script>
    <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
  </body>
</html>
